- name: Demo on filters
  hosts: local
  connection: local
  vars:
    topics: "Linux, Ansible, DevOps, shell"
    names:
    - sai
    - pavan
    - balina
    topic: ANSIBLE
  tasks:
  - name: print the name
    debug:
      msg: "Hi,{{ person_name | default('saipavan') }}" 

  - name: convert string to list
    debug:
      msg: "topics are: {{ topics | split(',') | trim }}"  

  - name: convert list to string
    debug:
      msg: "Full name: {{ names | join(' ') }}" 

  - name: convert to lower case
    debug:
      msg: "Topic: {{ topic | lower }}"      