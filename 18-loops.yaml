- name: Install Packages
  hosts: local
  become: yes
  connection: local
  vars:
    packages:
      - { name: 'nginx' , state: 'absent' }
      - { name: 'mysql' , state: 'present' }
      - { name: 'git' , state: 'present' }
      - { name: 'net-tools' , state: 'present' }  
      - { name: 'htop' , state: 'present' }
  tasks:
  - name: Install packages
    package:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop: "{{ packages }}"