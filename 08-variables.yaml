- name: variables from prompt
  hosts: local
  connection: local
  vars_prompt:
  - name: username
    promt: "Please enter your name"
    private: false

  - name: password
    promt: "Please enter your password"
    private: true
  tasks:
  - name: print the confidential information
    debug:
      msg: "username is {{ username }} and password is {{ password }}"
