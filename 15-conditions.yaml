- name: 
  hosts: local
  become: yes
  connection: local
  tasks:
  - name: Installing nginx in RedHat
    dnf:
      state: present
      name: nginx
    when: ansible_facts.os_family == "RedHat" #expression

  - name: Installing nginx in Debain
    apt:
      state: present
      name: nginx
    when: ansible_facts.os_family == "Debain" #expression  
