- name: 
  hosts: local
  connection: local
  tasks:
  - name: print the os
    dnf:
      state: present
      name: nginx
    when: ansible_facts.os_family == "RedHat" #expression

  - name: print the os is ubuntu or not
    apt:
      state: present
      name: nginx
    when: ansible_facts.os_family == "Debain" #expression  
